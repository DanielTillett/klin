name: Feature request
description: Suggest a change or a new feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do on your device, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: How Klin could help, and any alternatives you considered.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Memory, CPU, platform or dependency limits on your device that matter here.
