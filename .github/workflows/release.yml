# Release (doc/RELEASES.md): on a pushed tag v<VERSION>, or by hand from the
# Actions tab with the tag chosen as the ref ("Use workflow from"), builds
# the source tarball, SBOM and SHA256SUMS (build/release.py), checks that
# the tarball builds on its own and its unit tests pass, signs both files
# with GitHub artifact attestations (build provenance, and the SBOM;
# keyless, through Sigstore) and creates a DRAFT GitHub release with them.
# Nothing is published to the release page until a maintainer reviews the
# draft and publishes it by hand.
#
# Every job works on the one commit the run is for (github.sha), and the
# signatures name the tag as their source; the draft is made only if the
# tag still names that commit.
#
# Signing uses the workflow's OIDC identity: there is no key to create or
# store. In a public repository the signatures are recorded in Sigstore's
# public transparency log (Rekor) when this workflow runs.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Started for a tag
        if: github.ref_type != 'tag'
        run: |
          echo "::error::run this workflow from a tag (Use workflow from: vX.Y.Z), not a branch"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev zlib1g-dev python3 python3-yaml git cmake ninja-build
      - name: Source tarball, SBOM and checksums
        run: python3 build/release.py --tag "$TAG" --ref "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --out dist
      - name: Release checks (reproducible, SBOM, the tarball builds alone)
        run: python3 test/run_release_checks.py --dist dist --ref "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  sign:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      id-token: write          # the OIDC identity the signatures carry
      attestations: write      # store the attestations with the repository
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Version
        id: v
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Build provenance (SLSA) for the tarball and the SBOM
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/klin-*
      - name: SBOM attestation for the tarball
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/klin-*.tar.gz
          sbom-path: dist/klin-${{ steps.v.outputs.version }}.spdx.json
      - name: Collect the attestation bundles
        env:
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          mkdir bundles
          cp "$PROVENANCE" "bundles/klin-${TAG#v}.provenance.sigstore.json"
          cp "$SBOM" "bundles/klin-${TAG#v}.sbom.sigstore.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundles
          path: bundles/
          if-no-files-found: error

  draft:
    needs: sign
    runs-on: ubuntu-24.04
    permissions:
      contents: write          # create the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
      - name: Draft release (not published)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          # the tag must still name the commit that was built and signed
          tagged=$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | sort -k2 | tail -1 | cut -f1)
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG now names $tagged, not $GITHUB_SHA: no draft"
            exit 1
          fi
          # this version's ChangeLog section as the notes
          awk -v v="Klin $version:" '/^(Klin|KLone) [0-9]/ { if (f) exit; f = ($0 == v); next }
            f { sub(/^\t/, ""); print }' ChangeLog > notes.txt
          test -s notes.txt
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Klin $version" --notes-file notes.txt \
            out/dist/* out/bundles/*
