# OpenSSF Scorecard (doc/RELEASES.md, WORKFLOWS): weekly and on pushes to
# master, a check of the repository's supply-chain practices (pinned
# dependencies, token permissions, branch protection, signed releases, ...).
# Results go to the repository's code scanning alerts, a workflow artifact
# and (publish_results) the public Scorecard API, which shows them at
# scorecard.dev and serves the README's badge. Publishing makes the
# scorecard-action check this workflow: only approved actions, no
# top-level env, and the job's OIDC token (id-token: write) identifies the
# repository to the API.
name: Scorecard

on:
  push:
    branches: [master]
  schedule:
    - cron: "29 2 * * 2"
  branch_protection_rule:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read            # the workflow runs (CI-Tests, SAST checks)
      security-events: write   # upload the results
      id-token: write          # publish them (the repository's identity)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: scorecard.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: scorecard.sarif
          category: scorecard
